<template id="empty-template">
  <div class="empty">
    <h3>Chưa có tuyến model nào</h3>
    <p>Thêm một alias và ít nhất một model CPA thật làm đích.</p>
    <button class="primary" type="button" data-action="add-route">Thêm tuyến đầu tiên</button>
  </div>
</template>

<template id="route-template">
  <article class="route-card">
    <aside class="route-rail"><span class="ordinal"></span><span class="rail-label">Tuyến</span></aside>
    <div class="route-body">
      <div class="route-top">
        <div class="field">
          <label>Alias của client</label>
          <input type="text" data-field="alias" placeholder="auto" autocomplete="off">
          <small>Tên mà client gửi trong trường model.</small>
        </div>
        <div class="route-actions">
          <button class="icon-button" type="button" data-action="up" aria-label="Đưa tuyến lên">↑</button>
          <button class="icon-button" type="button" data-action="down" aria-label="Đưa tuyến xuống">↓</button>
          <button class="danger-button" type="button" data-action="remove">Xoá</button>
        </div>
      </div>

      <div class="route-preview" aria-hidden="true">
        <span class="preview-alias"></span><span class="preview-line"></span><span class="preview-targets"></span>
      </div>

      <div class="field-grid">
        <div class="field">
          <label>Cách chọn đích</label>
          <select data-field="strategy"><option value="priority">Theo thứ tự ưu tiên</option><option value="round-robin">Xoay vòng</option></select>
        </div>
        <div class="field">
          <label>Cooldown (giây)</label>
          <input type="number" data-field="cooldown_seconds" min="0" step="1" inputmode="numeric">
          <small>Để 0 sẽ dùng mặc định 60 giây.</small>
        </div>
      </div>

      <div class="targets">
        <div class="targets-head">
          <strong>Danh sách model đích theo thứ tự <button class="target-help" type="button" data-target-help aria-label="Trợ giúp về trọng số: ở chế độ xoay vòng, trọng số lặp model này trong lịch chia lượt. CPA vẫn tự chọn tài khoản nhà cung cấp thật." title="Ở chế độ xoay vòng, trọng số lặp model này trong lịch chia lượt. CPA vẫn tự chọn tài khoản nhà cung cấp thật.">!</button></strong>
          <button class="secondary" type="button" data-action="add-target">Thêm đích</button>
        </div>
        <div class="target-list"></div>
      </div>
    </div>
  </article>
</template>

<template id="target-template">
  <div class="target-row">
    <span class="target-number"></span>
    <select data-target-field="model" aria-label="Model CPA làm đích"></select>
    <div class="target-controls">
      <label class="target-weight"><span class="sr-only">Trọng số xoay vòng</span><input type="number" data-target-field="weight" min="1" max="1000000" step="1" inputmode="numeric" aria-label="Trọng số xoay vòng"></label>
      <label class="target-cooldown"><span class="sr-only">Cooldown riêng cho đích này (giây)</span><input type="number" data-target-field="cooldown_seconds" min="0" step="1" inputmode="numeric" aria-label="Cooldown riêng cho đích này (giây)" placeholder="tuyến"></label>
      <button class="icon-button" type="button" data-action="target-up" aria-label="Đưa đích lên">↑</button>
      <button class="icon-button" type="button" data-action="target-down" aria-label="Đưa đích xuống">↓</button>
      <button class="danger-button" type="button" data-action="remove-target">Xoá</button>
    </div>
  </div>
</template>
